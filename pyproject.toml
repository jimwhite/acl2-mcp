[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acl2-mcp"
version = "0.1.0"
description = "MCP server for ACL2 theorem prover"
readme = "README.md"
license = {text = "BSD-3-Clause"}
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3.0,<3.0.0",
    "jupyter_client>=8.0",
    "pyzmq>=25.0",
]
classifiers = [
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.0.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.setuptools]
packages = ["acl2_mcp"]
include-package-data = false

[tool.setuptools.package-data]
acl2_mcp = ["_kernel/*.lisp", "_kernel/*.asd", "_lib/*"]

[project.scripts]
acl2-mcp = "acl2_mcp.server:main"
acl2-mcp-install = "acl2_mcp.provision:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    # jupyter_client 8.10 schedules a run_sync coroutine on its shutdown runner
    # loop at interpreter exit; the coroutine can be collected un-awaited.
    "ignore:coroutine 'KernelManager\\._async_.*' was never awaited:RuntimeWarning",
]
markers = [
    "acl2: test requires a working ACL2 executable (ACL2 environment variable or acl2 on PATH)",
]
